#cloud-config
hostname: scriber-hel
manage_etc_hosts: true
package_update: true
package_upgrade: false

users:
  - default
  - name: elias
    gecos: Elias
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

ssh_pwauth: false
disable_root: false

write_files:
  - path: /tmp/scriber-Caddyfile
    owner: root:root
    permissions: "0644"
    content: |
      app.usescriber.com {
        encode zstd gzip
        reverse_proxy 127.0.0.1:3000
      }

runcmd:
  - fallocate -l 8G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg git ufw docker.io docker-compose-v2 caddy
  - install -m 0644 /tmp/scriber-Caddyfile /etc/caddy/Caddyfile
  - curl -fsSL https://tailscale.com/install.sh | sh
  - apt-get update
  - systemctl enable --now docker
  - usermod -aG docker elias
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - |
      if tailscale up --authkey=__TAILSCALE_AUTHKEY__ --hostname=scriber-hel --ssh; then
        ufw allow in on tailscale0
      else
        echo "Tailscale auth failed; leaving temporary public SSH open for repair." >&2
        touch /var/log/scriber-tailscale-auth.failed
        ufw allow OpenSSH
      fi
  - ufw --force enable
  - systemctl enable --now caddy
  - mkdir -p /opt/scriber
  - chown -R elias:elias /opt/scriber

final_message: "Scriber dedicated host is provisioned. SSH over Tailscale as elias@scriber-hel."
